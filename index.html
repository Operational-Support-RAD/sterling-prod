<title>Sterling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap">
<style>
/* Layout concept: a quiet ledger. One column of work on the left, the day's hour budget on the right, gray ink on paper, one optional accent. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#151515; --muted:#5C5C5C; --line:#DADADA; --soft:#EBEBEB;
  --accent:#6E6E6E;
  --warn:#8A5200; --warn-fill:#C77B00; --warn-bg:#F6EAD6;
  --good:#1F7A4D; --good-bg:#DDF0E5;
  --bad:#B3261E; --bad-bg:#F8DEDB;
  --rev:#0B6B6D; --rev-bg:#DCEFEE;
  --p1:#B3261E; --p1bg:#F8DEDB; --p2:#8A5200; --p2bg:#F6EAD6; --p3:#2F5BEA; --p3bg:#E1E8FD;
  --scrim:rgba(0,0,0,.45);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1B1B1B; --ink:#F2F2F2; --muted:#A8A8A8; --line:#2E2E2E; --soft:#262626;
    --accent:#9A9A9A;
    --warn:#E8A33D; --warn-fill:#E8A33D; --warn-bg:#3A2C14;
    --good:#4CC38A; --good-bg:#16301F;
    --bad:#F07167; --bad-bg:#3B1B18; --rev:#5CC8CA; --rev-bg:#12302F;
  --p1:#F07167; --p1bg:#3B1B18; --p2:#E8A33D; --p2bg:#3A2C14; --p3:#8FA8FF; --p3bg:#1E2744;
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1B1B1B; --ink:#F2F2F2; --muted:#A8A8A8; --line:#2E2E2E; --soft:#262626;
  --accent:#9A9A9A;
  --warn:#E8A33D; --warn-fill:#E8A33D; --warn-bg:#3A2C14;
  --good:#4CC38A; --good-bg:#16301F;
  --bad:#F07167; --bad-bg:#3B1B18; --rev:#5CC8CA; --rev-bg:#12302F;
  --p1:#F07167; --p1bg:#3B1B18; --p2:#E8A33D; --p2bg:#3A2C14; --p3:#8FA8FF; --p3bg:#1E2744;
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
.app{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:8px 6px}
.brand{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.brand svg{display:inline-block;width:.7em;height:.8em;vertical-align:baseline;margin:0 .015em}
.brand svg path{fill:none;stroke:var(--accent)}
.brand .dot{display:inline-block;width:.12em;height:.12em;margin-left:.07em;background:var(--accent)}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.demo{color:var(--muted);font-size:12.5px;margin:0 0 4px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:10px 20px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.yel{color:var(--warn)}
.tab.yel[aria-current="page"]{color:var(--warn);border-bottom-color:var(--warn-fill)}
.btn.del{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.del:hover{filter:brightness(.92)}
.btn.rev{background:none;border-color:transparent;color:var(--rev);font-weight:600}
.btn.rev:hover,.btn.rev[aria-expanded=true]{background:none;border-color:transparent;color:var(--rev);text-decoration:underline}
.revbox{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.revlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}
.revlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px}
.revlist .rd{font-size:12.5px;color:var(--muted);grid-column:1}
.revlist .rt{white-space:pre-wrap;overflow-wrap:anywhere;grid-column:1}
.revlist .trashbtn{grid-column:2;grid-row:1 / span 2;align-self:start}
.revbox textarea{width:100%;box-sizing:border-box;min-height:64px;font:inherit;font-size:15px}
.revfoot{display:flex;justify-content:flex-end;margin-top:14px}
.rvpop{width:min(560px,100%)}
.rvall .rvdate{font-size:10.5px}
.rvall .rvkr{font-size:11.5px}
.rvgoal{margin:16px 0 6px;font-size:13px}
.rvgoal:first-child{margin-top:0}
.btn.revbig{font-size:14px;padding:6px 8px}
.rvent{margin:0 0 12px}
.rvdate{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--rev);margin-bottom:2px}
.rvkr{color:var(--muted);font-size:13.5px;margin-bottom:2px}
.rvall{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;line-height:1.5;user-select:text;max-height:60vh;overflow:auto}
.rvpop textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;resize:vertical}
.ghead .trashbtn{margin-left:6px}
.rvdel{display:inline-flex;align-items:center;gap:6px;line-height:1.2;font-size:12.5px;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.quiet{background:none;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);border-color:var(--line)}
input,select,textarea{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:18px;height:18px;padding:0;margin:0;flex:none;border:1.5px solid var(--muted);border-radius:50%;background:transparent;display:inline-grid;place-content:center;cursor:pointer;vertical-align:middle;transition:background .12s,border-color .12s}
input[type="checkbox"]::after{content:"";width:4px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg);display:none}
input[type="checkbox"]:checked{background:var(--ink);border-color:var(--ink)}
input[type="checkbox"]:checked::after{display:block}
input[type="checkbox"]:hover:not(:disabled){border-color:var(--ink)}
input[type="checkbox"]:disabled{opacity:.45;cursor:default}
input[type="checkbox"]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2,.sheet h2{font-family:var(--font-display);font-weight:600;font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
.card h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.datebar .day{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em;margin-inline:6px}
.empty{color:var(--muted);margin:0}
.chip{display:inline-flex;align-items:center;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip a{color:inherit}
.warn{color:var(--warn)}
.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0;padding-top:0}
.task .chk{margin-top:2px}
.ttitle{background:none;border:0;padding:0;font-weight:500;color:var(--ink);text-align:left;cursor:pointer;overflow-wrap:anywhere}
.ttitle:hover{text-decoration:underline}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;color:var(--muted)}
.tright{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select{color:var(--ink);font-size:14px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.frm .wide{grid-column:1/-1}
.chk-row{display:flex;align-items:center;gap:8px;color:var(--ink)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.brow:first-of-type{border-top:0}
.bname{font-weight:500}
.binput{display:flex;align-items:center;gap:6px;color:var(--muted)}
.binput input{width:74px;text-align:right;font-variant-numeric:tabular-nums}
.bbar{grid-column:1/-1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.bbar i.over{background:var(--warn-fill)}
.bline{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.availrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.availrow input{width:84px;text-align:right}
.total{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;color:var(--ink);font-weight:500}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.otask{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.otask:first-of-type{border-top:0}
.oact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.oact input[type="date"]{padding:3px 6px;font-size:12.5px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{border-top:0;color:var(--muted);font-weight:500;font-size:12.5px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(600px,100%);margin:auto}
.modal.center .sheet{margin:auto}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:60;max-width:calc(100vw - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.linklike{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
a{color:var(--ink)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.grow{flex:1 1 auto}
.plain{background:transparent;border:1px solid transparent;color:var(--muted);padding:5px 6px;border-radius:8px;cursor:pointer}
.plain:hover{border-color:var(--line);color:var(--ink)}
.chip.hi{background:var(--ink);color:var(--bg)}
.tasks.big .task{padding:13px 0}
.tasks.big .ttitle{font-size:15px}
.tmeta{gap:4px 12px}
.card.side{background:transparent}
.card.side h2{font-family:var(--font-body);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted)}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.segb{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segb button{background:var(--surface);color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.segb button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:40}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:start}
.wcol .task{grid-template-columns:auto minmax(0,1fr);gap:4px 8px;padding:11px 0}
.wcol .task .tright{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}
.wcol .task .tmeta.dates{gap:4px 10px;font-size:12px}
.wcol .task .ttitle{font-size:14px;display:inline;line-height:1.35}
.wcol .task .ttitle{display:block;overflow:hidden}
.wcol .task .txp{margin-right:0}
#main:has(.txp) .wgrid>.card:not(:has(.txp)){opacity:.3;filter:blur(2px)}
.tp{width:min(520px,100%)}
.tp .tphd{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.tp .tphd .chk{margin-top:5px}
.tp .tphd h2{margin:0;font-size:18px;line-height:1.3;flex:1;min-width:0;overflow-wrap:anywhere}
.tp.done .tphd h2{text-decoration:line-through;color:var(--muted)}
.tp .tpx{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.tp .tmeta.dates{margin:0 0 14px 28px;gap:6px 14px}
.tp .tprow{display:flex;gap:10px;align-items:center;margin:0 0 14px 28px;flex-wrap:wrap}
.tp .txp{margin-top:0}
.tp .tpft{display:flex;justify-content:flex-end;margin-top:12px}
.wcol.today{border-color:var(--ink)}
.whead{display:flex;justify-content:space-between;gap:8px;width:100%;background:none;border:0;padding:0 0 8px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhd{font-size:12px;color:var(--muted);text-align:center}
.mcell{min-height:68px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);min-width:0}
.mcell:hover{border-color:var(--muted)}
.mcell.today{border:2px solid var(--ink)}
.mcell.off{background:transparent}
.mn{font-weight:600;font-size:13px}
.mc{font-size:12px;color:var(--muted)}
.kr{border-top:1px solid var(--line);padding:10px 0}
.kr:first-of-type{border-top:0}
.krhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.krbody{border-left:2px solid var(--line);padding-left:12px;margin-top:10px;display:flex;flex-direction:column;gap:14px}
.kpsheet{width:min(760px,100%)}
.kphead{display:flex;gap:12px 16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.kptitle{flex:1 1 240px;min-width:0}
.kptitle h2{margin:0;font-size:18px;overflow-wrap:anywhere}
.kppop .kpmeta{margin:0;flex:none;margin-left:auto;justify-content:flex-end}
.kppop .tphd{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.kppop .tphd h2{margin:0;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.kppop .tpx,.rvpop .tpx{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.kpmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.kppop .krbody{border-left:0;padding-left:0;margin-top:8px}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}

.chip.p1{background:var(--p1bg);color:var(--p1)}
.chip.p2{background:var(--p2bg);color:var(--p2)}
.chip.p3{background:var(--p3bg);color:var(--p3)}
.chip.lead{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pdot.p1{background:var(--p1)}.pdot.p2{background:var(--p2)}.pdot.p3{background:var(--p3)}
.vis{color:var(--ink);font-weight:600}
.dp{padding:3px 6px;font-size:12.5px}
.cal td{white-space:normal;text-align:left;vertical-align:top;min-width:140px}
.cal th{text-align:left}
.calt{font-size:12.5px;padding:2px 0;overflow-wrap:anywhere}
.calt.done{text-decoration:line-through;color:var(--muted)}
.sect{font-family:var(--font-display);font-size:18px;margin:28px 0 2px;letter-spacing:-.01em}
.sectsub{margin:0 0 12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}

.c1{display:flex;align-items:center;gap:2px;min-height:22px}
.grip{background:none;border:0;color:var(--muted);cursor:grab;padding:0;width:24px;height:28px;line-height:1;touch-action:none;letter-spacing:-3px;font-size:14px;border-radius:6px;user-select:none;flex:none}
.grip:hover{color:var(--ink);background:var(--soft)}
.dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;background:var(--surface);border:1px solid var(--ink)!important;border-radius:10px;padding:8px 10px!important;box-shadow:0 8px 24px rgba(0,0,0,.28);margin:0;list-style:none}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.ins-b{box-shadow:0 -2px 0 0 var(--ink)}
.ins-a{box-shadow:0 2px 0 0 var(--ink)}
.dz-over{outline:2px dashed var(--accent);outline-offset:3px}
.pop{position:absolute;z-index:70;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.24);width:min(260px,calc(100vw - 32px))}
.pophd{font-weight:600;margin-bottom:8px;overflow-wrap:anywhere}
.vrow{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brd-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 108px 128px 52px;gap:10px;align-items:center}
.kact{display:flex;justify-content:flex-end;gap:0}
.kcard .kact{position:absolute;right:4px;top:4px;background:var(--surface);border-radius:6px}

const pad = n => String(n).padStart(2, '0');

const dayDiff = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const TODAY = iso(new Date());
const fmtDay = s => parseISO(s).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'});
const fmtH = n => (Math.round((+n || 0) * 100) / 100) + ' h';

  S.tasks.forEach(function(t){
    if (!t.grp) return;

      const r = S.tasks.find(x => x.id === id); if (!r || !r.asg || r.asg.state !== 'wait') return;

    const raw = localStorage.getItem(KEY);

      const o = JSON.parse(raw);

function parseCSV(text){
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}

function reviewText(year, per){
  const r = PERIODS[per], from = year + '-' + pad(r[0]) + '-01', to = year + '-' + pad(r[1]) + '-31';
  const end = to < TODAY ? to : TODAY;
  let out = 'Review ' + per + ' ' + year + ', ' + me().name + '\n';
  S.goals.filter(g => g.year === year && !g.deleted).forEach(function(g){
    out += '\n' + g.title + ' [' + (g.status || 'Not started') + ']\n';
    S.krs.filter(k => k.goalId === g.id && !k.deleted).forEach(function(k){
      const ts = liveTasks().filter(t => t.krId === k.id && t.owner === S.me && t.done && t.doneAt >= from && t.doneAt <= to);
      const hist = k.hist.filter(h => h.at <= end), stNow = hist.length ? hist[hist.length - 1].status : 'Not started';
      const rf = S.reflections.filter(x => x.userId === S.me && x.targetType === 'kr' && x.targetId === k.id && x.date >= from && x.date <= to);
      if (!ts.length && !rf.length && stNow === 'Not started') return;
      out += '- ' + k.title + ' [' + qLabel(k.quarter) + ', ' + stNow + ']: ' + ts.length + ' tasks completed\n';
      ts.slice().sort((a, b) => a.doneAt < b.doneAt ? -1 : 1).forEach(t => { out += '    ' + t.doneAt + '  ' + t.title + (t.note ? ' (' + t.note + ')' : '') + '\n'; });
      rf.forEach(x => { out += '    Reflection ' + x.date + ': ' + x.text + '\n'; });
    });
    S.reflections.filter(x => x.userId === S.me && x.targetType === 'goal' && x.targetId === g.id && x.date >= from && x.date <= to)
      .forEach(x => { out += '  Goal reflection ' + x.date + ': ' + x.text + '\n'; });
  });
  const ch = liveTasks().filter(t => t.owner === S.me && t.done && t.doneAt >= from && t.doneAt <= to);
  out += '\nTasks completed in this period: ' + ch.length + '\n';
  return out;
}

const weekStart = () => ui.leadWeek || mondayOf(TODAY);
function weekDays(m){
  const d = [0, 1, 2, 3, 4].map(i => addDays(m, i));
  [5, 6].forEach(function(i){
    const ds = addDays(m, i);
    if (S.users.some(u => { const e = dayEntry(u.id, ds); return e && e.type === 'special'; })) d.push(ds);
  });
  return d;
}
function personWeek(uid_, days){
  const avail = sum(days, d => effAvail(uid_, d));
  const per = {}, label = {};
  days.forEach(function(d){
    if (effAvail(uid_, d) <= 0) return;
    const p = getPlan(uid_, d);
    p.blocks.forEach(function(b){ const k = b.name.trim().toLowerCase(); label[k] = label[k] || b.name; per[k] = (per[k] || 0) + (+p.hours[b.id] || 0); });
  });
  const planned = sum(Object.keys(per), k => per[k]);
  const od = overdueTasks(uid_);
  return {avail: avail, per: per, label: label, planned: planned, unest: 0,
    over: od, overFlag: od.filter(t => dayDiff(TODAY, t.date) >= S.settings.overdueDays).length};
}
function blockCols(rows){
  const cols = [], seen = {};
  const add = (k, n) => { if (!seen[k]) { seen[k] = 1; cols.push({id: k, name: n}); } };
  S.users.forEach(u => viewOf(u.id).forEach(b => add(b.name.trim().toLowerCase(), b.name)));
  rows.forEach(r => Object.keys(r.w.per).forEach(k => add(k, r.w.label[k])));
  return cols;
}
function ptoStats(u){
  const y = String(parseISO(TODAY).getFullYear()); let taken = 0, planned = 0;
  Object.keys(S.days).forEach(function(k){
    const p = k.split('|');
    if (p[0] === u.id && S.days[k].type === 'pto' && p[1].slice(0, 4) === y) { if (p[1] < TODAY) taken++; else planned++; }
  });
  const allow = u.pto || 0;
  return {allow: allow, taken: taken, planned: planned, left: allow - taken - planned};
}

  const item = type === 'Task' ? S.tasks.find(x => x.id === id) : type === 'Goal' ? goal(id) : kr(id);
  if (!item) return false;
  item.deleted = null;
  if (type === 'Task') {
    item.krId = null; item.needReview = true;
    if (item.done) { item.done = false; item.doneAt = null; item.note = ''; if (item.status === 'Done') item.status = 'Not started'; }
  }
  return true;
}

function trashItems(){

  if (isLead()) S.goals.filter(g => g.deleted).forEach(g => out.push({type: 'Goal', id: g.id, title: g.title, at: g.deleted, own: true}));
  if (isLead()) S.krs.filter(k => k.deleted).forEach(k => out.push({type: 'Key result', id: k.id, title: k.title, at: k.deleted, own: true}));

/* ---------- drag and drop (pointer events, so it works with a finger too) ---------- */
const gkey = t => t.done ? 9 : (t.priority || 4);
function placeTask(id, ids, idx){
  const t = byId(id); if (!t) return null;
  const list = ids.map(byId).filter(Boolean);
  const same = list.filter(x => gkey(x) === gkey(t));
  if (!same.length) return {clamped: true, moved: false};
  const first = list.indexOf(same[0]), last = list.indexOf(same[same.length - 1]) + 1;
  const i = Math.min(Math.max(idx, first), last);
  const prev = list[i - 1] && gkey(list[i - 1]) === gkey(t) ? list[i - 1] : null;
  const next = list[i] && gkey(list[i]) === gkey(t) ? list[i] : null;
  let o;
  if (prev && next) o = ((prev.order || 0) + (next.order || 0)) / 2;
  else if (prev) o = (prev.order || 0) + 1;
  else if (next) o = (next.order || 0) - 1;
  else return null;
  t.order = o;
  return {clamped: i !== idx};
}

    for (let i = 0; i < ins.length; i += 200) {
      const chunk = ins.slice(i, i + 200);
      const rows = chunk.map(k => ({kind: cur[k].kind, id: cur[k].id, team_id: team, owner_id: cur[k].owner, data: cur[k].data, assignee_id: cur[k].assignee}));
      const r = await SB.from('items').insert(rows);
      if (r.error) { failed = r.error; break; }
      chunk.forEach(k => { cloud.synced[k] = sig(cur[k]); cloud.meta[k] = {owner: cur[k].owner}; });
    }
    if (!failed) {
      for (let i = 0; i < upd.length; i += 8) {
        const chunk = upd.slice(i, i + 8);
        const rs = await Promise.all(chunk.map(function(k){
          const c = cur[k], patch = {data: c.data, assignee_id: c.assignee};
          if (c.kind === 'task') patch.owner_id = c.owner;
          return SB.from('items').update(patch).eq('kind', c.kind).eq('id', c.id);
        }));
        rs.forEach(function(r, j){ if (r.error) failed = r.error; else cloud.synced[chunk[j]] = sig(cur[chunk[j]]); });
        if (failed) break;
      }
    }
    if (!failed) {
      for (let i = 0; i < del.length; i += 8) {
        const chunk = del.slice(i, i + 8);
        const rs = await Promise.all(chunk.map(function(k){ const p = k.split('|'); return SB.from('items').delete().eq('kind', p[0]).eq('id', k.slice(p[0].length + 1)); }));
        rs.forEach(function(r, j){ if (r.error) failed = r.error; else { delete cloud.synced[chunk[j]]; delete cloud.meta[chunk[j]]; } });
        if (failed) break;
      }
    }
    const sigU = S.users.map(u => u.id).join(',');
    if (!failed && sigU !== cloud.orderSig && isLead()) {
      const r = await SB.rpc('set_person_order', {p_ids: S.users.map(u => u.id)});
      if (r.error) failed = r.error; else cloud.orderSig = sigU;
    }
  } catch(e) { failed = e; }
  cloud.busy = false;
  if (failed) {
    toast('Some changes could not be saved: ' + (failed.message || 'unknown error') + '. Reloading your data.');
    try { await hydrateData(); render(); } catch(e) {}
    return;
  }
  if (cloud.dirty) flush();
}
function cloudSave(){
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({theme: S.theme, accent: S.accent})); } catch(e) {}
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(flush, 500);
}
async function refreshCloud(){
  if (!CLOUD || !SB || !S.signedIn || cloud.busy || cloud.timer && cloud.dirty) return;
  if (!$('#modal').hidden || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))) return;
  const sig0 = JSON.stringify([S.tasks.length, S.goals.length, S.krs.length]);
  try { const r = await hydrateData(); if (r === 'ok') { render(); if (cloud.dirty) flush(); } } catch(e) {}
}
async function enterCloud(){
  let r;
  try { r = await hydrateData(); } catch(e) { authErr('Could not load your data: ' + (e.message || e)); return false; }
  if (r === 'noteam') {
    let pend = null; try { pend = JSON.parse(localStorage.getItem('sterling-join') || 'null'); } catch(e) {}
    const em = ((await SB.auth.getSession()).data.session || {user: {}}).user.email;
    if (pend && pend.email === em) {
      const j = await SB.rpc('join_team', {p_code: pend.code, p_name: pend.name});
      if (j.error) { authErr(j.error.message); return false; }
      try { localStorage.removeItem('sterling-join'); } catch(e) {}
      r = await hydrateData();
    } else { authErr('This account has no team yet. Open Create account and enter your invite code.'); ui.authTab = 'up'; return false; }
  }
  if (r !== 'ok') return false;
  S.signedIn = true; ui.authErr = '';
  document.body.classList.add('cloud');
  showAuth(); render();
  if (cloud.dirty) flush();
  return true;
}
async function startCloud(){
  $('#auth').hidden = false; $('#auth').innerHTML = '<div class="authbox"><p class="authhint">Loading…</p></div>';
  if (!window.supabase) { try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'); } catch(e) {} }
  if (!window.supabase) { $('#auth').hidden = false; $('#auth').innerHTML = '<div class="authbox"><p class="autherr">Could not load the sign-in library. Check your connection and reload.</p></div>'; return; }
  SB = window.supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: true, autoRefreshToken: true}});
  const sess = (await SB.auth.getSession()).data.session;
  if (sess) { await enterCloud(); } else showAuth();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refreshCloud(); });
  setInterval(refreshCloud, 120000);
}

S = CLOUD ? emptyState() : load();
if (!S.teamCode) S.teamCode = 'STERLING-OPS';

ui.authTab = 'in'; ui.authErr = '';

      '<label class="fld">Password<input id="au-p" type="password" autocomplete="current-password"></label>' +
      (ui.authErr ? '<p class="autherr" role="alert">' + esc(ui.authErr) + '</p>' : '') +
      '<button class="btn primary" type="submit">Sign in</button></form>' +
      (CLOUD ? '' : '<p class="authhint">Demo: use maya@demo.team (team lead) or dan@demo.team, iris@demo.team, leo@demo.team, nora@demo.team. Any password works.</p>') :

    '</div></div>';
}
function showAuth(){
  const a = $('#auth');
  if (S.signedIn) { a.hidden = true; a.innerHTML = ''; return; }
  a.hidden = false; a.innerHTML = authHtml();
  const f = a.querySelector('input'); if (f) { try { f.focus({preventScroll: true}); } catch(e) {} }
}
/* cloud auth and team actions */
async function cloudSignIn(f){
  const e = f.querySelector('#au-e').value.trim().toLowerCase(), pw = f.querySelector('#au-p').value;
  if (!e || !pw) { authErr('Enter your email and password.'); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  const r = await SB.auth.signInWithPassword({email: e, password: pw});
  btn.disabled = false;
  if (r.error) { authErr(/invalid login/i.test(r.error.message) ? 'Wrong email or password.' : r.error.message); return; }
  S.view = 'today'; await enterCloud();
}
async function cloudSignUp(f){
  const n = f.querySelector('#au-n').value.trim(), e = f.querySelector('#au-e').value.trim().toLowerCase(), pw = f.querySelector('#au-p').value, c = f.querySelector('#au-c').value.trim();
  if (!n || !e || !pw || !c) { authErr('Fill in all fields.'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { authErr('Enter a valid email.'); return; }
  if (pw.length < 8) { authErr('Password needs at least 8 characters.'); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try { localStorage.setItem('sterling-join', JSON.stringify({email: e, name: n, code: c})); } catch(x) {}
  let r = await SB.auth.signUp({email: e, password: pw, options: {data: {name: n}}});
  if (r.error && /already/i.test(r.error.message)) r = await SB.auth.signInWithPassword({email: e, password: pw});
  else if (!r.error && r.data && r.data.user && !r.data.session && (r.data.user.identities || []).length === 0) r = await SB.auth.signInWithPassword({email: e, password: pw});
  btn.disabled = false;
  if (r.error) { authErr(/invalid login/i.test(r.error.message) ? 'This email already has an account. Use Sign in.' : r.error.message); return; }
  if (!r.data.session) { ui.authTab = 'in'; ui.authErr = ''; showAuth(); authErr('Check your email and confirm your address, then sign in.'); return; }
  await enterCloud();
}
async function cloudSignOut(){
  clearTimeout(cloud.timer);
  try { await flush(); } catch(e) {}
  await SB.auth.signOut();
  S = emptyState(); cloud.synced = {}; cloud.meta = {}; cloud.loaded = false; ui.authTab = 'in'; ui.authErr = '';
  document.body.classList.remove('cloud'); closeModal(); showAuth();
}
async function cloudSetRole(el){
  const u = user(el.dataset.id); if (!u || !isLead()) return;
  const want = el.value === 'lead' ? 'lead' : 'member';
  const r = await SB.rpc('set_role', {p_user: u.id, p_role: want});
  if (r.error) { el.value = u.role === 'Team lead' ? 'lead' : 'member'; toast(r.error.message); return; }
  u.role = want === 'lead' ? 'Team lead' : (u.level || 'Member');
  toast(u.name + (want === 'lead' ? ' is now a team lead.' : ' is now a member.'));
  if (!isLead()) { closeModal(); if (S.view === 'lead') S.view = 'today'; }
  render(); if (ui.pp === u.id) refreshPerson(u.id);
}
async function cloudNewCode(){
  const r = await SB.rpc('new_invite_code');
  if (r.error) { toast(r.error.message); return; }
  S.teamCode = r.data; toast('New code created. The old one no longer works.'); render();
}
function authErr(msg){
  ui.authErr = msg;
  const f = $('#auth form'); if (!f) return;
  let el = f.querySelector('.autherr');
  if (!el) { el = document.createElement('p'); el.className = 'autherr'; el.setAttribute('role', 'alert'); f.insertBefore(el, f.querySelector('button[type=submit]')); }
  el.textContent = msg;
}

acts.signOut = function(){ if (CLOUD) return cloudSignOut(); S.signedIn = false; ui.authTab = 'in'; ui.authErr = ''; closeModal(); save(); showAuth(); };

forms.signUp = function(f){
  if (CLOUD) return cloudSignUp(f);
  const n = f.querySelector('#au-n').value.trim(), e = f.querySelector('#au-e').value.trim().toLowerCase(), pw = f.querySelector('#au-p').value, c = f.querySelector('#au-c').value.trim();
  if (!n || !e || !pw || !c) { authErr('Fill in all fields.'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { authErr('Enter a valid email.'); return; }
  if (pw.length < 8) { authErr('Password needs at least 8 characters.'); return; }
  if (S.users.some(x => emailOf(x).toLowerCase() === e)) { authErr('This email already has an account.'); return; }
  if (c.toUpperCase() !== S.teamCode.toUpperCase()) { authErr('This invite code is not valid.'); return; }
  const id = 'u' + (S.users.length + 1 + Math.floor(Math.random() * 1000));
  S.users.push({id: id, name: n, role: 'Member', email: e});
  S.me = id; S.signedIn = true; S.view = 'today'; ui.authErr = ''; save(); showAuth(); render();
};
ORD = S.tasks.reduce((m, t) => Math.max(m, t.order || 0), 0);
chg.setRole = function(el){
  if (CLOUD) return cloudSetRole(el);
  const u = user(el.dataset.id); if (!u || !isLead()) return;
  const lead = u.role === 'Team lead';
  if (el.value === 'lead' && !lead) { u.prevRole = u.role; u.role = 'Team lead'; toast(u.name + ' is now a team lead.'); }

if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch(e) {} }

if (CLOUD) { document.body.classList.add('cloudmode'); startCloud(); } else { render(); showAuth(); }
